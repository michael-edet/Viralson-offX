[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Redirects from legacy GitHub / subpage URLs to 11ty clean permalinks
[[redirects]]
  from = "/Assets/page/subpage/news.html"
  to = "/news/"
  status = 301

[[redirects]]
  from = "/Assets/page/subpage/entertainment.html"
  to = "/entertainment/"
  status = 301

