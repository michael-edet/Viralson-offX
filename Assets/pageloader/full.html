<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Page Loader</title>
    <style>
        /* Page Loader Styles */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .vs-logo {
            width: 80px;
            height: 80px;
            background-color: #3498db;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
            animation: pulse 2s infinite;
        }

        .loading-lines {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .line {
            height: 8px;
            width: 200px;
            border-radius: 4px;
            background-color: #e8f4fc;
            position: relative;
            overflow: hidden;
        }

        .line::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                #3498db,
                #3498db 10px,
                transparent 10px,
                transparent 20px
            );
            animation: loading 1.5s infinite;
        }

        .line:nth-child(2)::after {
            animation-delay: 0.2s;
        }

        .line:nth-child(3)::after {
            animation-delay: 0.4s;
        }

        .line:nth-child(4)::after {
            animation-delay: 0.6s;
        }

        @keyframes loading {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 8px 20px rgba(52, 152, 219, 0.5);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
            }
        }

        /* Demo content styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }

        .content {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            color: #3498db;
            margin-bottom: 20px;
        }

        p {
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .demo-button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .demo-button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <!-- Page Loader -->
    <div class="page-loader" id="pageLoader">
        <div class="vs-logo">VS</div>
        <div class="loading-lines">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
    </div>

    <!-- Demo Content -->
    <div class="content">
        <h1>Viral Son Blogging Platform</h1>
        <p>Welcome to the Viral Son blogging platform. This is a demonstration of the page loader with VS logo and animated dotted lines.</p>
        <p>The loader uses the brand's color theme with white background and light blue accents.</p>
        <button class="demo-button" id="showLoader">Show Loader Again</button>
    </div>

    <script>
        // Hide the loader when the page is fully loaded
        window.addEventListener('load', function() {
            const pageLoader = document.getElementById('pageLoader');
            
            // Add a small delay to ensure the loader is visible for at least 2 seconds
            setTimeout(function() {
                pageLoader.classList.add('hidden');
                
                // Remove the loader from DOM after the transition completes
                setTimeout(function() {
                    pageLoader.style.display = 'none';
                }, 500);
            }, 2000);
        });

        // Show loader again for demonstration purposes
        document.getElementById('showLoader').addEventListener('click', function() {
            const pageLoader = document.getElementById('pageLoader');
            pageLoader.style.display = 'flex';
            setTimeout(function() {
                pageLoader.classList.remove('hidden');
            }, 10);
            
            // Hide the loader again after 3 seconds
            setTimeout(function() {
                pageLoader.classList.add('hidden');
                setTimeout(function() {
                    pageLoader.style.display = 'none';
                }, 500);
            }, 3000);
        });
    </script>
</body>
</html>
